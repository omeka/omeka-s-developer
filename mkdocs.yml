site_name: Omeka S Developer Documentation
theme:
    name: 'material'
    custom_dir: 'overrides'
    include_homepage_in_sidebar: false
    navigation_depth: 3
    logo: assets/omeka-logo.png
    font:
        text: Lato
    static_templates:
        - landing.html
plugins:
    - search
    - blog:
        blog_dir: blog
repo_url: 'http://github.com/omeka/omeka-s-developer'
extra_css:
    - css/extra.css
    - css/iconfonts.css
markdown_extensions:
    - toc:
        permalink: 
    - admonition: {}
    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
        extend_pygments_lang:
          - name: php-inline
            lang: php
            options:
                startinline: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
nav:
    - developer/index.md
    - Changes:
        - developer/whatsnew.md
        - developer/for_classic_developers.md
        - developer/devpriorities.md
    - API:
        - developer/api/index.md
        - developer/api/php_api.md
        - developer/api/rest_api.md
        - developer/api/representations.md
        - developer/api/api_reference.md
        - developer/api/rest_api_reference.md
    - Concepts:
        - developer/miscellaneous/acl.md
        - developer/miscellaneous/doctrine_orm.md
        - developer/miscellaneous/forms.md
        - developer/miscellaneous/internationalization.md
    - Configuration:
        - developer/configuration/index.md
        - developer/configuration/config_reference.md
        - developer/configuration/services_and_factories.md
    - Events:
        - developer/events/server_events.md
